name: Build macOS App

on:
  push:
    branches:
      - feat/macos-desktop-mvp
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Smoke test
        run: python main.py --smoke-test

      - name: Build macOS app
        run: |
          pyinstaller --noconfirm --clean --windowed \
            --name "Doc24Sender" \
            --collect-all playwright \
            main.py

      - name: Ad-hoc sign app bundle
        run: |
          codesign --force --deep --sign - dist/Doc24Sender.app
          codesign --verify --deep --strict --verbose=2 dist/Doc24Sender.app

      - name: Create install package
        run: |
          rm -rf package
          mkdir -p package
          ditto dist/Doc24Sender.app package/Doc24Sender.app
          cp scripts/install-macos.command package/설치.command
          chmod +x package/설치.command
          cat > package/먼저읽어주세요.txt <<'EOF'
문서24 재발송기 macOS 버전

1. 가능하면 먼저 '설치.command'를 실행하세요.
2. 설치 스크립트는 Doc24Sender.app을 ~/Applications에 복사하고 다운로드 격리 속성을 정리한 뒤 앱을 실행합니다.
3. macOS가 설치.command 자체를 막는 경우 Apple의 Gatekeeper 정책 때문입니다. 이 경우 시스템 설정 > 개인정보 보호 및 보안 > 그래도 열기를 한 번 허용해야 합니다.
4. Apple Developer ID 서명/공증이 없는 개인 빌드이므로 Gatekeeper 경고를 완전히 없앨 수는 없습니다.
5. 실제 발송 체크 전에는 수신기관 검색/선택까지만 테스트합니다.
EOF
          ditto -c -k --sequesterRsrc --keepParent package Doc24Sender-macOS-v2.zip

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: Doc24Sender-macOS-v2
          path: Doc24Sender-macOS-v2.zip
